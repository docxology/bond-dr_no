claims:
  - id: "isotope-library-size"
    claim: "the emission-line library contains 10 real gamma-emitting isotopes"
    source: "src/dr_no/isotope_profiles.py::isotope_library"
    verified: true
  - id: "stability-class-count"
    claim: "six Pasquill–Gifford stability classes (A–F) are modelled"
    source: "src/dr_no/plume_model.py::STABILITY_CLASSES"
    verified: true
  - id: "dispersion-coefficients-published"
    claim: >-
      sigma_y and sigma_z reproduce published Pasquill-Gifford values at 100,
      500 and 1000 m for all six classes (15% tolerance, the precision a
      log-log graph read supports), and preserve the physical class ordering
      sigma(A) > ... > sigma(F). Only Martin's near-field (x <= 1 km) sigma_z
      branch is implemented; beyond 1 km sigma_z is an extrapolation of that
      fit, and both coefficients are floored at 0.1 m near the source where
      Martin's negative f_z offsets go non-positive.
    source: "tests/test_plume_model.py::test_sigma_z_matches_published_pasquill_gifford"
    verified: true
  - id: "no-mock-framework"
    claim: >-
      No mock framework in src/ or tests/, and exactly four declared
      monkeypatch.setattr substitutions - enforced by parsing the suite's own
      AST, not by a grep that cannot see monkeypatch.
    source: "tests/test_suite_hygiene.py"
    verified: true
  - id: "threat-band-count"
    claim: "five threat bands (LOW…CRITICAL) with breached-containment escalation"
    source: "src/dr_no/island_assessment.py::THREAT_LEVELS"
    verified: true
  - id: "coverage-gate"
    claim: "src/ coverage >= 90% line and branch, no mocks"
    source: "docs/_generated/COUNTS.md"
    verified: true
  - id: "decay-chain-count"
    claim: "five real Bateman parent-daughter decay chains with transient equilibrium"
    source: "src/dr_no/decay_chain.py::decay_chains"
    verified: true
  - id: "currie-mda"
    claim: "minimum detectable activity via Currie L_D = 2.71 + 4.65 sqrt(B)"
    source: "src/dr_no/spectrum_processing.py::minimum_detectable_activity"
    verified: true
  - id: "shielding-materials"
    claim: "real mass-attenuation tables for lead, iron, concrete, water (0.05-3.0 MeV), bracketing every isotope-library gamma line"
    source: "src/dr_no/shielding.py::MASS_ATTENUATION_CM2_G"
    verified: true
  - id: "single-source-metrics"
    claim: "mission results and manuscript tokens both derive from canonical_metrics()"
    source: "src/dr_no/canonical.py::canonical_metrics"
    verified: true
