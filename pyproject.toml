# Dr. No (1962) — CRAB KEY mission software
# BOND suite phase-2 film package: radiation / isotope forensics.
# Repository: https://github.com/docxology/bond-dr_no

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dr_no"
version = "0.3.0"
license = {text = "MIT"}
description = "CRAB KEY — gamma-spectrum isotope identification, plume dispersion, and island threat assessment"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

[tool.uv.sources]
bond-api = { path = "../bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
mypy_path = ["src", "."]
explicit_package_bases = true
# Runtime is 3.14; >=3.12 is required to parse numpy 2.x's PEP-695 `type` stubs.
python_version = "3.12"
warn_return_any = true
files = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
