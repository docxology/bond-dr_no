# Experiment plan — CRAB KEY (dr_no)
# Declares the deterministic mission scenario and expected outputs (validation input).

mission:
  fixture: "src/dr_no/mission.py::_SCENARIO"

conditions:
  - name: "gamma identification"
    input: "synthesized Cs-137 + Co-60 spectrum"
    expect: "recover Cs-137 and Co-60 as top identifications"
  - name: "plume dispersion"
    input: "Q=4.0e5 Bq/s, u=3 m/s, class D, H=10 m"
    expect: "positive downwind concentration, monotone falloff, isopleth extent"
  - name: "island risk"
    input: "two facilities (breached/contained)"
    expect: "per-facility threat band + containment action + island aggregate"

primary_metric: "byte-deterministic mission report"

expected_figures:
  - gamma_spectrum
  - plume_field

reproducibility: "fixed seed 42; no RNG; no wall-clock in artifacts"
